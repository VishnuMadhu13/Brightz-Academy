version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: brightmindz_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-brightmindz_db}
      POSTGRES_USER: ${DB_USER:-brightmindz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-brightmindz_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - brightmindz_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-brightmindz_user} -d ${DB_NAME:-brightmindz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: brightmindz_backend
    restart: always
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,brightmindzacademy.com,www.brightmindzacademy.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://www.brightmindzacademy.com}
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-brightmindz_db}
      DB_USER: ${DB_USER:-brightmindz_user}
      DB_PASSWORD: ${DB_PASSWORD:-brightmindz_secret_password}
      DB_HOST: db
      DB_PORT: "5432"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
      CLOUDFLARE_STREAM_ACCOUNT_ID: ${CLOUDFLARE_STREAM_ACCOUNT_ID}
      CLOUDFLARE_STREAM_API_TOKEN: ${CLOUDFLARE_STREAM_API_TOKEN}
      WHATSAPP_PHONE_NUMBER: ${WHATSAPP_PHONE_NUMBER:-919846000000}
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brightmindz_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: brightmindz_frontend
    restart: always
    networks:
      - brightmindz_net

  nginx:
    image: nginx:alpine
    container_name: brightmindz_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - brightmindz_net

volumes:
  postgres_data:
  media_volume:
  static_volume:
  certbot_conf:
  certbot_www:

networks:
  brightmindz_net:
    driver: bridge
