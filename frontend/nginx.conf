server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Do not advertise the nginx version (ZAP 10036)
    server_tokens off;

    # ---- Security headers -------------------------------------------------
    # IMPORTANT: nginx does not inherit add_header into a location that defines its
    # own add_header. So no location below uses add_header; caching is done with
    # "expires", which does not reset these.
    add_header X-Frame-Options "SAMEORIGIN" always;                                   # ZAP 10020
    add_header X-Content-Type-Options "nosniff" always;                               # ZAP 10021
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;  # ZAP 10063

    # Content-Security-Policy (ZAP 10038). Starting point: adjust the video and API hosts to
    # what the app really loads, then test checkout and video playback in a browser.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://iframe.videodelivery.net https://*.cloudflarestream.com https://iframe.mediadelivery.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # The SPA entry point must always be revalidated (ZAP 10049: storable and cacheable content)
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching (Vite hashes file names, so long caching is safe)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}